<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4e79" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Heures" />
    <title>Suivi d'heures</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="demo-banner" class="demo-banner" hidden>
      Données d'exemple. <a href="./">Revenir à mes données</a>
    </div>
    <div id="splash" class="splash">Chargement…</div>
    <div id="login-root" class="login" hidden></div>
    <div id="app-layout" class="layout" hidden>
      <nav id="tabs" class="tabs" aria-label="Écrans"></nav>
      <main>
        <section id="screen-today" class="screen"><div id="today-root" class="stack"></div></section>
        <section id="screen-history" class="screen" hidden><div id="history-root" class="stack"></div></section>
        <section id="screen-calendar" class="screen" hidden><div id="calendar-root" class="stack"></div></section>
        <section id="screen-stats" class="screen" hidden><div id="stats-root" class="stack"></div></section>
        <section id="screen-settings" class="screen" hidden><div id="settings-root" class="stack"></div></section>
      </main>
    </div>

    <dialog id="day-dialog"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
