<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4e79" />
    <title>Suivi d'heures</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <h1>Suivi d'heures</h1>

      <section class="timer">
        <p id="timer-value" class="timer-value">0h 00m 00s</p>
        <button id="toggle-button" type="button" class="toggle">Démarrer</button>
      </section>

      <section class="totals">
        <div class="total">
          <span class="total-label">Aujourd'hui</span>
          <span id="total-today" class="total-value">0h 00m</span>
        </div>
        <div class="total">
          <span class="total-label">Cette semaine</span>
          <span id="total-week" class="total-value">0h 00m</span>
        </div>
      </section>

      <section>
        <h2>Sessions du jour</h2>
        <ul id="session-list" class="session-list"></ul>
        <p id="session-empty" class="session-empty">Aucune session aujourd'hui.</p>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
